<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Little Day</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&family=Sniglet:wght@400;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <main class="app">
      <div class="decor decor-star star-1">✦</div>
      <div class="decor decor-star star-2">☆</div>
      <div class="decor decor-star star-3">✧</div>

      <img class="decor goat goat-1" src="cozy_goat_stickers/goat_flower.png" />
      <img class="decor goat goat-2" src="cozy_goat_stickers/goat_heart.png" />
      <img class="decor goat goat-3" src="cozy_goat_stickers/goat_sleep.png" />

      <!-- Header -->
      <header class="header">
        <div class="greeting">
          <div class="greeting-icon-date">
            <div class="greeting-icon"></div>
            <p class="date">Monday, September 11</p>
          </div>
          <h1>My little day</h1>
        </div>

        <button class="theme-button">☼</button>
      </header>

      <!-- Intro -->
      <section class="intro">
        <p>Let's make today a little better ♡</p>
      </section>

      <!-- Content -->
      <section class="content">
        <!-- Tasks -->
        <div class="tasks-card">
          <div class="card-header">
            <h2>✦ Today's tasks</h2>
            <span class="task-count">3/5</span>
          </div>

          <ul class="task-list"></ul>

          <!-- Add task -->
          <form class="task-form">
            <input
              class="task-input"
              type="text"
              placeholder="What needs to be done?"
            />

            <button class="add-task-button">+</button>
          </form>
        </div>

        <!-- Progress -->
        <aside class="progress-card">
          <h2>♡ Little progress</h2>

          <div class="progress-circle">
            <span class="progress-percent">70%</span>
          </div>

          <p class="progress-text">You're doing great!</p>

          <span class="progress-small"> 3 of 5 tasks completed </span>
        </aside>
      </section>

      <!-- Footer -->
      <footer>
        <p>take it slow · you are doing enough ♡</p>
      </footer>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
